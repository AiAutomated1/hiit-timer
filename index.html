<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HIIT">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>HIIT Timer</title>
<style>
  :root{
    --bg:#0b0b0f; --card:#17171f; --card2:#1f1f29; --line:#2a2a36; --muted:#9a9aab; --text:#f5f5f7;
    --work:#16a34a; --rest:#dc2626; --move:#2563eb; --prep:#f59e0b; --water:#0891b2; --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;touch-action:manipulation}
  body{-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
  input:focus,textarea:focus,select:focus{border-color:#4b4b5c}
  input[type=number]{-moz-appearance:textfield;text-align:center;font-variant-numeric:tabular-nums}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
  .screen.active{display:flex}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:8px}
  .hdr h1{font-size:30px;font-weight:800}
  .hdr .ttl{font-size:17px;font-weight:700;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link{color:#4ade80;font-size:17px;font-weight:600;padding:8px 2px;min-width:64px;text-align:left}
  .link.r{text-align:right}
  .icon{width:40px;height:40px;border-radius:20px;background:var(--card);display:grid;place-items:center;font-size:19px}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px calc(env(safe-area-inset-bottom) + 120px)}
  .eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .group{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
  .card{background:var(--card);border-radius:14px}
  .muted{color:var(--muted)}
  .tnum{font-variant-numeric:tabular-nums}
  .startbar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(rgba(11,11,15,0),var(--bg) 35%);pointer-events:none}
  .startbar > *{pointer-events:auto}
  .start{width:100%;padding:19px;border-radius:18px;background:var(--work);font-size:21px;font-weight:800;letter-spacing:.02em}
  .start:active{transform:scale(.98)}
  .btn{padding:12px 14px;border-radius:12px;background:var(--card2);font-weight:650;font-size:15.5px}
  .btn.full{width:100%}
  .btn.green{background:var(--work)}
  .btn.danger{color:var(--danger)}
  .btn.armed,.mini.armed{background:var(--danger);color:#fff}
  .mini{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
  .mini:disabled{opacity:.3}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:#2c2c38;padding:10px 18px;border-radius:20px;font-size:14.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;white-space:nowrap}
  .toast.show{opacity:1}

  /* list */
  .wk{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden;background:var(--danger)}
  .wk .acts{position:absolute;inset:0;display:flex;justify-content:flex-end}
  .wk .acts button{width:76px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .wk .acts .a-edit{background:#3b3b4a}.wk .acts .a-dup{background:var(--move)}.wk .acts .a-del{background:var(--danger)}
  .wk .face{position:relative;background:var(--card);padding:16px;display:flex;align-items:center;gap:12px;touch-action:pan-y;transition:transform .22s ease}
  .wk .face.drag{transition:none}
  .wk .face .body{flex:1;min-width:0}
  .wk .nm{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wk .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .wk .tt{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
  .hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}

  /* preview */
  .total{font-size:15px;color:var(--muted);margin-bottom:14px}
  .total b{color:var(--text);font-size:22px;font-variant-numeric:tabular-nums}
  .stations{display:flex;flex-direction:column;gap:8px}
  .st{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
  .n{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .st .body{flex:1;min-width:0}
  .st .name{font-weight:650;font-size:17px}
  .st .sets{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
  .st .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;flex:none}
  .between{font-size:12.5px;color:var(--muted);padding:0 14px 0 54px}
  .between.water{color:#67e8f9} .between.break{color:#c4b5fd}

  /* editor */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
  .row + .row{border-top:1px solid var(--line)}
  .row label{font-size:16px}
  .row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .tap{width:100%;text-align:left}
  .chev{color:var(--muted);font-size:20px}
  .strow{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px}
  .strow .n{margin-top:7px}
  .strow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .strow input{padding:8px 10px;font-weight:650}
  .setsbtn{text-align:left;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:9px;background:var(--card2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
  .setsbtn .ov{color:#4ade80}
  .strow .side{display:flex;flex-direction:column;gap:6px}
  .stepper{display:flex;align-items:center;gap:6px;flex:none}
  .stepper input{width:64px;padding:8px 4px}
  .stepper button{width:36px;height:36px;border-radius:10px;background:var(--card2);font-size:20px;font-weight:600}
  .switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
  .switch.on{background:var(--work)}
  .switch.on::after{transform:translateX(20px)}
  select{width:auto;padding:8px 10px}
  .seg{display:flex;background:var(--line);border-radius:9px;padding:2px;flex:none}
  .seg button{padding:7px 9px;border-radius:7px;font-size:13.5px;font-weight:650;color:var(--muted)}
  .seg button.on{background:#3a3a48;color:var(--text)}
  .edtotal{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .edtotal b{color:var(--text)}

  /* sheet */
  .sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end}
  .sheet-wrap.open{display:flex}
  .sheet{width:100%;max-height:calc(100% - env(safe-area-inset-top) - 24px);background:#121219;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;gap:10px}
  .sh-title{font-size:20px;font-weight:750}
  .sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 24px)}
  .tabs{display:flex;background:var(--card);border-radius:11px;padding:3px;margin:6px 0 10px}
  .tabs button{flex:1;padding:9px 4px;border-radius:9px;font-size:14.5px;font-weight:650;color:var(--muted)}
  .tabs button.on{background:#33333f;color:var(--text)}
  .bform{background:var(--card);border-radius:14px;padding:12px 14px}
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .fgrid label,.fl{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
  .fgrid input{padding:9px 4px}
  .pv{font-size:14.5px;margin:12px 0 10px;font-variant-numeric:tabular-nums;line-height:1.4}
  .pv.warn{color:#fbbf24}
  .setrow{display:grid;grid-template-columns:52px 1fr 14px 1fr 36px;gap:8px;align-items:center;padding:6px 0}
  .setrow .k{font-size:14px;color:var(--muted);font-weight:650}
  .setrow input{padding:9px 4px}
  .setrow .sl{text-align:center;color:var(--muted)}
  .setrow input.na{opacity:.4}
  .setrow .lbl{grid-column:2 / 5;text-align:left;padding:7px 10px;font-size:15px;margin-top:-2px}
  .sethead{display:grid;grid-template-columns:52px 1fr 14px 1fr 36px;gap:8px;font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
  .sethead span:nth-child(2),.sethead span:nth-child(4){text-align:center}
  .pat{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .pat + .pat{border-top:1px solid var(--line)}
  .pat .body{flex:1;min-width:0}
  .pat .nm{font-weight:650}
  .pat .ss{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:8px}

  /* run */
  #run{transition:background-color .25s;background:var(--prep);padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 12px)}
  #run.work{background:var(--work)} #run.rest{background:var(--rest)} #run.transition{background:var(--move)}
  #run.prep{background:var(--prep)} #run.water{background:var(--water)} #run.break{background:#7c3aed}
  .topbar{display:flex;align-items:center;gap:10px}
  .overall{flex:1}
  .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.25);overflow:hidden}
  .bar > i{display:block;height:100%;background:rgba(255,255,255,.9);width:0;border-radius:3px}
  .overall .meta{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-top:5px;opacity:.9;font-variant-numeric:tabular-nums}
  .x{width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.22);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;white-space:nowrap}
  .x.confirm{width:auto;padding:0 14px;background:rgba(0,0,0,.5)}
  .main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0}
  .phase{font-size:clamp(28px,8vw,44px);font-weight:900;letter-spacing:.12em}
  .station{font-size:clamp(22px,6.5vw,34px);font-weight:700;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .setof{font-size:clamp(16px,4.5vw,22px);font-weight:600;opacity:.85;margin-top:2px}
  .count{font-size:min(44vw,36vh);line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:2vh 0}
  .phasebar{width:100%;max-width:520px}
  .phasebar .bar{height:10px;border-radius:5px}
  .next{margin-top:14px;font-size:clamp(17px,4.8vw,24px);font-weight:650;background:rgba(0,0,0,.2);padding:10px 16px;border-radius:12px;max-width:100%}
  .controls{display:flex;gap:12px;align-items:stretch}
  .controls button{flex:1;height:min(15vh,104px);border-radius:22px;background:rgba(0,0,0,.25);display:grid;place-items:center}
  .controls button:active{background:rgba(0,0,0,.4)}
  .controls .pp{flex:1.5;background:rgba(255,255,255,.95);color:#111}
  .controls svg{width:40px;height:40px}
  .pausedtag{position:absolute;top:50%;left:0;right:0;text-align:center;pointer-events:none;display:none}
  #run.paused .main{opacity:.45}
  #run.paused .pausedtag{display:block}
  .pausedtag span{background:rgba(0,0,0,.65);padding:10px 22px;border-radius:30px;font-weight:800;letter-spacing:.2em;font-size:20px}
  .wl{font-size:11.5px;font-weight:600;opacity:.8;text-align:center;margin:6px 0 10px;min-height:14px}

  /* finish */
  .sum-head{text-align:center;padding:18px 0 4px}
  .sum-head h2{font-size:40px;font-weight:900}
  .sum-head .sub{color:var(--muted);margin:2px 0 18px}
  .stats{margin:0 auto 6px}
  .brk{background:var(--card);border-radius:14px;padding:4px 14px;margin-top:8px}
  .brk .r{display:flex;align-items:center;gap:10px;padding:10px 0}
  .brk .r + .r{border-top:1px solid var(--line)}
  .brk .r .nm{flex:1;min-width:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brk .r .v{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .brk .ok{color:#4ade80}.brk .part{color:#fbbf24}.brk .no{color:#6b6b7b}
  .saved{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
  .hsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .hsum .stat{padding:12px}
  .hsum .stat b{font-size:26px}
  .hday{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:16px 0 6px}
  .hent{background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden}
  .hent > button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px}
  .hent .body{flex:1;min-width:0}
  .hent .nm{font-weight:650;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hent .sub{font-size:13.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .hent .tt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#3b2f12;color:#fbbf24;margin-left:6px;vertical-align:1px}
  .hdet{padding:0 14px 14px;display:none}
  .hent.open .hdet{display:block}
  .hdet .brk,.hdet .stat{background:var(--card2)}
  .wk .last{font-size:12.5px;color:#4ade80;margin-top:2px}
  .hdr .acts2{display:flex;gap:8px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;margin-bottom:28px}
  .stat{background:var(--card);border-radius:16px;padding:16px}
  .stat b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.wide{grid-column:span 2}
  #finish .start{max-width:420px}
</style>
</head>
<body>

<!-- WORKOUTS LIST -->
<section id="list" class="screen active">
  <div class="hdr"><h1>Workouts</h1><div class="acts2"><button class="icon" data-act="open-history" aria-label="History">◷</button><button class="icon" data-act="open-settings" aria-label="Settings">⚙︎</button></div></div>
  <div class="scroll" id="listBody"></div>
  <div class="startbar"><button class="start" data-act="new-workout">+ New workout</button></div>
</section>

<!-- PREVIEW -->
<section id="preview" class="screen">
  <div class="hdr"><button class="link" data-act="go-list">‹ Back</button><button class="link r" data-act="edit-current">Edit</button></div>
  <div class="scroll" id="pvBody"></div>
  <div class="startbar"><button class="start" data-act="start">START</button></div>
</section>

<!-- EDITOR -->
<section id="editor" class="screen">
  <div class="hdr"><button class="link" data-act="editor-done">‹ Done</button><div class="edtotal" id="edTotal"></div></div>
  <div class="scroll" id="edBody"></div>
</section>

<!-- SETTINGS -->
<section id="settings" class="screen">
  <div class="hdr"><button class="link" data-act="go-list">‹ Back</button><div class="ttl">Settings</div><div style="min-width:64px"></div></div>
  <div class="scroll" id="setBody"></div>
</section>

<!-- RUN -->
<section id="run" class="screen prep">
  <div class="topbar">
    <div class="overall">
      <div class="bar"><i id="overallBar"></i></div>
      <div class="meta"><span id="stationOf"></span><span id="timeLeft"></span></div>
    </div>
    <button class="x" id="endBtn" aria-label="End workout">✕</button>
  </div>
  <div class="wl" id="wlStatus"></div>
  <div class="main">
    <div class="phase" id="phase">GET READY</div>
    <div class="station" id="station"></div>
    <div class="setof" id="setof"></div>
    <div class="count" id="count">10</div>
    <div class="phasebar"><div class="bar"><i id="phaseBar"></i></div></div>
    <div class="next" id="next"></div>
  </div>
  <div class="pausedtag"><span>PAUSED</span></div>
  <div class="controls">
    <button id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="pp" id="ppBtn" aria-label="Pause"><svg id="ppIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button id="skipBtn" aria-label="Skip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
  </div>
</section>

<!-- FINISH -->
<section id="finish" class="screen">
  <div class="scroll" id="finBody"></div>
  <div class="startbar"><button class="start" data-act="go-list">DONE</button></div>
</section>

<!-- HISTORY -->
<section id="history" class="screen">
  <div class="hdr"><button class="link" data-act="go-list">‹ Back</button><div class="ttl">History</div><div style="min-width:64px"></div></div>
  <div class="scroll" id="histBody"></div>
</section>

<!-- SET BUILDER SHEET -->
<div class="sheet-wrap" id="sheet">
  <div class="sheet">
    <div class="sheet-hdr">
      <div style="min-width:0"><div class="eyebrow" id="shKind"></div><div class="sh-title" id="shTitle"></div></div>
      <button class="btn green" data-act="sheet-close">Done</button>
    </div>
    <div class="sheet-scroll" id="shBody"></div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSION = '1.3.0';
const MIN_WORK = 5;
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const int = (v, d = 0) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : d; };
const clampWork = v => Math.max(MIN_WORK, Math.min(3600, int(v, MIN_WORK)));
const clampRest = v => Math.max(0, Math.min(3600, int(v, 0)));
const clampCount = v => Math.max(1, Math.min(30, int(v, 1)));
function fmt(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, '0')}`; }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
// Two-tap confirm without browser dialogs
function confirmTap(btn, label = 'Sure?') {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; const old = btn.innerHTML; btn.innerHTML = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed) { delete btn.dataset.armed; btn.innerHTML = old; btn.classList.remove('armed'); } }, 3000);
  return false;
}

/* =========================================================
   Data
   ========================================================= */
const even = (n, work, rest) => Array.from({length:n}, () => ({work, rest}));
function seedData() {

function normSets(a) {

  const s = a.slice(0, 30).map(x => { const o = { work: clampWork(x && x.work), rest: clampRest(x && x.rest) }; const l = String((x && x.label) || '').trim().slice(0, 40); if (l) o.label = l; const c = String((x && x.cue) || '').trim().slice(0, 120); if (c) o.cue = c; return o; });

    prepSeconds: clampRest(w.prepSeconds ?? 10),
    transitionSeconds: clampRest(w.transitionSeconds ?? 15),

    defaultPattern: normSets(w.defaultPattern) || even(3, 40, 20),
    stations: (Array.isArray(w.stations) ? w.stations : []).slice(0, 60).map(s => ({

      name: String((s && s.name) || 'Station').slice(0, 40),

}

const KEY = 'hiit.data';

/* =========================================================
   Timeline: flatten a workout into timed phases.
   The last set's rest at each station is replaced by the move
   (or the water break, if one follows that station).
   ========================================================= */
function buildTimeline(w) {
  const tl = [];
  if (w.prepSeconds > 0) tl.push({type:'prep', dur:w.prepSeconds, st:0});
  w.stations.forEach((s, si) => {
    const sets = setsOf(w, s);
    const lastStation = si === w.stations.length - 1;
    sets.forEach((set, k) => {
      const lastSet = k === sets.length - 1;
      const rest = lastSet ? 0 : set.rest;
      tl.push({type:'work', dur:Math.max(MIN_WORK, set.work), st:si, set:k, sets:sets.length, restAfter:rest, label:set.label || '', cue:set.cue || ''});
      if (rest > 0) tl.push({type:'rest', dur:rest, st:si, set:k, sets:sets.length});
    });
    if (!lastStation) {
      const water = w.waterBreak && w.waterBreak.afterStation === si + 1 && w.waterBreak.seconds > 0;
      if (water) tl.push({type:'water', dur:w.waterBreak.seconds, st:si + 1});
      else if (s.breakAfter > 0) tl.push({type:'break', dur:s.breakAfter, st:si + 1});
      else if (w.transitionSeconds > 0) tl.push({type:'transition', dur:w.transitionSeconds, st:si + 1});
    }
  });
  let acc = 0;
  for (let i = tl.length - 1; i >= 0; i--) { tl[i].after = acc; acc += tl[i].dur; }
  tl.total = acc;
  return tl;
}
const totalOf = w => w.stations.length ? buildTimeline(w).total : 0;
const setsTime = sets => sets.reduce((a, s, k) => a + s.work + (k < sets.length - 1 ? s.rest : 0), 0);
const labelsOf = sets => [...new Set(sets.map(x => x.label).filter(Boolean))].join(' / ');
const setsSummary = sets => sets.map((s, k) => k === sets.length - 1 ? `${s.work}` : `${s.work}/${s.rest}`).join(' · ');

// swipe-to-reveal
let openFace = null;
function closeSwipe() { if (openFace) { openFace.style.transform = ''; openFace = null; } }
(function setupSwipe() {
  const box = $('listBody'); const OPEN = -228;
  let face = null, x0 = 0, y0 = 0, dx = 0, mode = null, base = 0;
  box.addEventListener('pointerdown', e => {
    const f = e.target.closest('.face'); if (!f) return;
    face = f; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null;
    base = (openFace === f) ? OPEN : 0;
  });
  box.addEventListener('pointermove', e => {
    if (!face) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode) { if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) mode = 'h'; else if (Math.abs(my) > 8) { mode = 'v'; } }
    if (mode === 'h') {
      dx = mx; face.classList.add('drag');
      face.style.transform = `translateX(${Math.min(0, Math.max(OPEN - 30, base + dx))}px)`;
    }
  });
  const end = () => {
    if (!face) return;
    face.classList.remove('drag');
    if (mode === 'h') {
      const pos = base + dx;
      if (pos < OPEN / 3) { if (openFace && openFace !== face) openFace.style.transform = ''; face.style.transform = `translateX(${OPEN}px)`; openFace = face; }
      else { face.style.transform = ''; if (openFace === face) openFace = null; }
      face.dataset.swiped = '1'; setTimeout(() => { if (face) delete face.dataset.swiped; }, 50);
      const f = face; setTimeout(() => delete f.dataset.swiped, 60);
    }
    face = null;
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
})();

function stepField(field, delta) {
  const w = edW();

}

/* ---------- Set builder sheet ---------- */
const bf = { tab:'even', evenN:4, evenW:45, evenR:20,
  dropStart:50, dropStep:10, dropN:3, dropMode:'fill', dropRest:15, dropTotal:60,
  pyrStart:30, pyrStep:10, pyrN:3, pyrMode:'fixed', pyrRest:20, pyrTotal:60, patName:'' };
let sheet = null; // { kind:'default'|'station', sid }
function sheetTarget() {
  const w = edW(); if (!w || !sheet) return null;
  if (sheet.kind === 'default') return { w, sets: w.defaultPattern, custom: true };
  const s = w.stations.find(x => x.id === sheet.sid); if (!s) return null;
  return { w, s, sets: setsOf(w, s), custom: !!s.sets };
}
function writeSets(sets) {
  const w = edW(); const clean = normSets(sets) || [];
  if (!clean.length) return toast('Keep at least one set');
  if (sheet.kind === 'default') w.defaultPattern = clean;
  else w.stations.find(x => x.id === sheet.sid).sets = clean;
  save(); updateEdTotal(); renderSheet();
}
function openSheet(kind, sid) { sheet = { kind, sid }; renderSheet(); $('sheet').classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); sheet = null; renderEditor(); }

function builderResult() {
  if (bf.tab === 'even') return { sets: even(clampCount(bf.evenN), clampWork(bf.evenW), clampRest(bf.evenR)), warn: '' };
  const p = bf.tab === 'drop'
    ? { start: bf.dropStart, step: bf.dropStep, n: bf.dropN, mode: bf.dropMode, rest: bf.dropRest, total: bf.dropTotal, dir: -1 }
    : { start: bf.pyrStart, step: bf.pyrStep, n: bf.pyrN, mode: bf.pyrMode, rest: bf.pyrRest, total: bf.pyrTotal, dir: 1 };
  const n = clampCount(p.n), step = Math.max(0, int(p.step)), start = clampWork(p.start);
  let warn = '', sets = [];
  for (let k = 0; k < n; k++) {
    let w = start + p.dir * step * k;
    if (w < MIN_WORK) { w = MIN_WORK; warn = 'Work stops at the 5s minimum.'; }
    let r;
    if (p.mode === 'fill') {
      const total = Math.max(0, int(p.total));
      r = total - w;
      if (r < 0) { r = 0; warn = `Total ${total}s is shorter than a ${w}s work set — rest set to 0.`; }
    } else r = clampRest(p.rest);
    sets.push({ work: w, rest: r });
  }
  return { sets, warn };
}
function previewText() {
  const { sets, warn } = builderResult();
  return { text: sets.map(s => `${s.work}/${s.rest}`).join(' → ') + `  ·  ${fmt(setsTime(sets))}`, warn };
}

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px">

  });
  html += `<button class="btn full" data-act="set-add" style="margin:8px 0 4px">+ Add set</button></div>

  $('shBody').innerHTML = html;

/* =========================================================

function start() {
  W = clone(getW(currentId)); if (!W || !W.stations.length) return toast('Add a station first');

/* =========================================================
   History
   ========================================================= */
const HKEY = 'hiit.history';

  const t = Date.parse(h.startedAt);

    startedAt: new Date(t).toISOString(), elapsed: clampRest(h.elapsed), planned: clampRest(h.planned), paused: clampRest(h.paused), early: !!h.early,

    }
    case 'water-toggle': { const w = edW(); w.waterBreak = w.waterBreak ? null : { afterStation: Math.max(1, Math.floor(w.stations.length / 2)), seconds: 60 }; changed(); break; }
    case 'sheet-default': openSheet('default'); break;
    case 'sheet-station': openSheet('station', strow.dataset.sid); break;
    case 'sheet-close': closeSheet(); break;
    case 'sh-tab': bf.tab = b.dataset.tab; renderSheet(); break;
    case 'sh-mode': { const pre = b.closest('.seg').dataset.mode; bf[pre + 'Mode'] = b.dataset.v; renderSheet(); break; }
    case 'sh-apply': { const old = sheetTarget().sets; writeSets(builderResult().sets.map((x, i) => old[i] && old[i].label ? { ...x, label: old[i].label } : x)); toast('Sets updated'); break; }
    case 'brk-inc': case 'brk-dec': { const s = edW().stations.find(x => x.id === sheet.sid); s.breakAfter = clampRest((s.breakAfter || 0) + (act === 'brk-inc' ? 15 : -15)); save(); updateEdTotal(); renderSheet(); break; }
    case 'sh-reset': { const w = edW(); w.stations.find(x => x.id === sheet.sid).sets = null; save(); updateEdTotal(); renderSheet(); break; }
    case 'set-add': { const t = sheetTarget(); const last = t.sets[t.sets.length - 1] || { work: 40, rest: 20 }; writeSets([...t.sets, { ...last }]); break; }
    case 'set-del': { const t = sheetTarget(); const k = int(setrow.dataset.k); writeSets(t.sets.filter((_, i) => i !== k)); break; }
    case 'pat-apply': { const p = DB.patterns.find(x => x.id === pat.dataset.pid); if (p) { writeSets(clone(p.sets)); toast(`Using ${p.name}`); } break; }
    case 'pat-del': if (confirmTap(b, '?')) { DB.patterns = DB.patterns.filter(x => x.id !== pat.dataset.pid); save(); renderSheet(); } break;
    case 'pat-save': {
      const name = ($('patName').value || '').trim(); if (!name) { toast('Give the pattern a name'); $('patName').focus(); break; }
      const t = sheetTarget(); const ex = DB.patterns.find(p => p.name.toLowerCase() === name.toLowerCase());
      if (ex) ex.sets = clone(t.sets); else DB.patterns.push({ id: uid(), name: name.slice(0, 40), sets: clone(t.sets) });
      bf.patName = ''; save(); toast(ex ? `Updated “${name}”` : `Saved “${name}”`); renderSheet(); break;
    }
    case 'opt-half': opts.halfway = !opts.halfway; saveOpts(); renderSettings(); break;
    case 'opt-audio': opts.audio = b.dataset.v; saveOpts(); try { if (ac) { ac.close(); } } catch (e) {} ac = null; master = null; applyAudioSession(); renderSettings(); break;
    case 'test-sound':
      unlockAudio(); SFX.count(); setTimeout(SFX.count, 1000); setTimeout(SFX.count, 2000);
      setTimeout(SFX.work, 3000); setTimeout(SFX.half, 4600); setTimeout(SFX.rest, 5600); setTimeout(SFX.move, 7000); setTimeout(SFX.finish, 8400);
      break;
    case 'export': doExport(); break;
    case 'copy-json': copyJson(); break;
    case 'import-file': $('importFile').click(); break;
    case 'import-paste': { const v = $('pasteJson').value.trim(); if (v) importText(v); else toast('Paste the backup text first'); break; }
  }
});

// text / number edits
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'edName') { edW().name = (t.value.trim() || 'Untitled workout').slice(0, 60); save(); return; }
  if (t.classList.contains('stname')) { const s = edW().stations.find(x => x.id === t.closest('.strow').dataset.sid); s.name = (t.value.trim() || 'Station').slice(0, 40); save(); return; }
  if (t.dataset.num) { setField(t.dataset.num, t.value); return; }
  if (t.id === 'waterAfter') { edW().waterBreak.afterStation = int(t.value, 1); changed(); return; }
  if (t.id === 'shBreak') { edW().stations.find(x => x.id === sheet.sid).breakAfter = clampRest(t.value); save(); updateEdTotal(); renderSheet(); return; }
  if (t.id === 'shNote') { edW().stations.find(x => x.id === sheet.sid).note = t.value.trim().slice(0, 80); save(); return; }
  if (t.dataset.set) {
    const st = sheetTarget(), k = int(t.closest('.setrow').dataset.k), sets = clone(st.sets);
    if (t.dataset.set === 'label') { const l = t.value.trim().slice(0, 40); if (l) sets[k].label = l; else delete sets[k].label; }
    else sets[k][t.dataset.set] = t.dataset.set === 'work' ? clampWork(t.value) : clampRest(t.value);
    if (t.dataset.set === 'work' && int(t.value) < MIN_WORK) toast('Work can\'t go below 5s');
    writeSets(sets); return;
  }
  if (t.id === 'importFile') {
    const f = t.files && t.files[0]; if (!f) return;
    f.text().then(importText).catch(() => toast('Could not read that file')); t.value = ''; return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bf) {
    bf[t.dataset.bf] = int(t.value, 0);
    const pv = previewText(), el = $('bfPreview');
    if (el) { el.className = 'pv' + (pv.warn ? ' warn' : ''); el.innerHTML = esc(pv.text) + (pv.warn ? '<br>' + esc(pv.warn) : ''); }
  }
  if (t.id === 'patName') bf.patName = t.value;
});
// select-all on focus for number fields makes quick edits easier
document.addEventListener('focusin', e => { if (e.target.type === 'number') setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });

// run controls
$('ppBtn').addEventListener('click', togglePause);
$('skipBtn').addEventListener('click', skip);
$('backBtn').addEventListener('click', back);
let endArmed = 0;
$('endBtn').addEventListener('click', () => {
  const b = $('endBtn');
  if (endArmed) { clearTimeout(endArmed); endArmed = 0; b.classList.remove('confirm'); b.textContent = '✕'; finish(true); return; }
  b.classList.add('confirm'); b.textContent = 'Tap to end';
  endArmed = setTimeout(() => { endArmed = 0; b.classList.remove('confirm'); b.textContent = '✕'; }, 3000);
});
$('run').addEventListener('click', () => { if (running && !wakeLock) lockScreen(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) { unlockAudio(); lockScreen(); tick(); }
});
document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.code === 'ArrowRight') skip();
  if (e.code === 'ArrowLeft') back();
});

/* =========================================================
   Boot
   ========================================================= */
load();
loadHist();
renderList();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
</script>
</body>
</html>
